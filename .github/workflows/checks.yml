# Repository-owned checks beyond the shared Test & Lint workflow: WebAssembly and no_std
# portability, documentation, the dependency policy, and the vendored specification files.
name: Portability & Licences

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm:
    name: WebAssembly and no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy for the browser target
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Clippy without std
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check licences, advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  spec:
    name: Vendored specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the pinned specification commit
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < SPEC_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout the specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: divejson/divejson
          ref: ${{ steps.pin.outputs.ref }}
          path: spec
          fetch-depth: 0

      - name: Every file the specification owns is byte-identical here
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! cmp -s "spec/$file" "$file"; then
              echo "::error file=$file::differs from divejson/divejson at SPEC_REF"
              status=1
            fi
          done < <(git -C spec ls-files -z -- schema fixtures docs)
          exit "$status"

      - name: The pin is on the specification's main branch
        run: git -C spec merge-base --is-ancestor "${{ steps.pin.outputs.ref }}" origin/main
