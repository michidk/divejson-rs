[package]
name = "divejson"
version = "0.0.0"
authors = ["The DiveJSON Authors"]
edition = "2024"
rust-version = "1.85"
description = "Read, write and validate DiveJSON, the open dive-log interchange format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michidk/divejson-rs"
homepage = "https://divejson.org"
documentation = "https://docs.rs/divejson"
readme = "README.md"
keywords = ["divejson", "diving", "scuba", "dive-log", "json"]
categories = ["parser-implementations", "encoding", "no-std", "wasm"]
# The conformance corpus is for this repository's tests, not for the published crate.
include = ["/src", "/LICENSE-MIT", "/LICENSE-APACHE", "/README.md", "/SPEC_REF"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "uuid/std", "thiserror/std", "jiff/std"]
## Read UDDF into DiveJSON and write DiveJSON as UDDF (`divejson::uddf`). Needs `std`.
uddf = ["std", "dep:uddf", "uuid/v5"]

[dependencies]
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.12", default-features = false }
jiff = { version = "1.0.3", default-features = false }
unicase = { version = "2.8.1", default-features = false }
uuid = { version = "1.16.0", default-features = false }
# Switch to the crates.io release once uddf is published.
uddf = { version = "0.0.0", git = "https://github.com/michidk/uddf-rs", rev = "07fd28c0386536e56e8f848400f27c0286c6552c", optional = true }

[dev-dependencies]
jsonschema = { version = "0.63.1", default-features = false }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }

[[test]]
name = "uddf"
required-features = ["uddf"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
as_conversions = "warn"
